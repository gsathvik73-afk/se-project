{% extends 'base.html' %}
{% block content %}
<h1>Delete this transaction?</h1>
<section class="panel">
  <p>{{ txn.txn_date }} · {{ txn.type|title }} · ₹{{ txn.amount }}</p>
  <p>This will remove the transaction and update your totals.</p>
  <form method="post" action="{{ url_for('web.transaction_delete', transaction_id=txn.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="confirm" value="yes">
    <button type="submit">Confirm delete</button>
    <a href="{{ url_for('web.transaction_list') }}">Cancel</a>
  </form>
</section>
{% endblock %}

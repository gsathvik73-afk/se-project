{% extends 'base.html' %}{% block content %}<p class="eyebrow">Organise</p><h1>Categories</h1><section class="panel"><h2>Add a category</h2><form class="inline" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required maxlength="80" value="{{ request.form.get('name','') }}"></label><button class="primary">Add category</button></form>{% if errors.name %}<p class="error">{{ errors.name }}</p>{% endif %}</section><section class="panel"><h2>Your categories</h2>{% for cat in cats %}<div class="category-row">{% if cat.user_id is none %}<strong>{{ cat.name }}</strong><span class="muted">Default</span>{% else %}<form class="inline" method="post" action="/categories/{{ cat.id }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Category name<input aria-label="Rename {{ cat.name }}" name="name" value="{{ cat.name }}" required maxlength="80"></label><button>Rename</button></form>{% endif %}</div>{% endfor %}</section>{% endblock %}

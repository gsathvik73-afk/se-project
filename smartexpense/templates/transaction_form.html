{% extends 'base.html' %}

{% block content %}
<p class="eyebrow">Transaction management</p>
<h1>Edit transaction</h1>

<section class="panel">
    <form method="post"
          action="{{ url_for('web.transaction_edit', transaction_id=txn.id) }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>
            Transaction type
            <select name="type" required>
                <option value="expense"
                    {% if form_data.get('type', txn.type) == 'expense' %}selected{% endif %}>
                    Expense
                </option>
                <option value="income"
                    {% if form_data.get('type', txn.type) == 'income' %}selected{% endif %}>
                    Income
                </option>
            </select>
            {% if errors.get('type') %}<span class="error">{{ errors.type }}</span>{% endif %}
        </label>

        <label>
            Amount (₹)
            <input type="number" name="amount" min="0.01" step="0.01"
                   value="{{ form_data.get('amount', txn.amount) }}" required>
            {% if errors.get('amount') %}<span class="error">{{ errors.amount }}</span>{% endif %}
        </label>

        <label>
            Date
            <input type="date" name="date"
                   value="{{ form_data.get('date', txn.txn_date.isoformat()) }}" required>
            {% if errors.get('date') %}<span class="error">{{ errors.date }}</span>{% endif %}
        </label>

        <button class="primary" type="submit">Save changes</button>
        <a href="{{ url_for('web.transaction_list') }}">Cancel</a>
    </form>
</section>
{% endblock %}

name: Quality and release package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: docs/reports/
  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartexpense:ci .
      - run: docker save smartexpense:ci | gzip > smartexpense-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: deployable-container
          path: smartexpense-image.tar.gz
